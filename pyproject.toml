[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "importance-agent"
version = "0.1.0"
description = "Evaluate information against your instructions on a 1–100 importance scale."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
importance_agent = ["py.typed"]
